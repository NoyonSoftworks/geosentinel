[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geosentinel"
version = "1.0.0"
description = "GeoSentinel: Open-Source Cyber Threat Intelligence & Geospatial OSINT Reconnaissance Framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Noyon Hossain", email = "mdnoyon356268@gmail.com"}
]
keywords = [
    "cybersecurity",
    "threat-intelligence",
    "osint",
    "geospatial-reconnaissance",
    "incident-response",
    "ioc-defanger",
    "soc-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
]

[project.scripts]
geosentinel = "src.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --verbose"
testpaths = [
    "tests",
]
pythonpath = ["."]
